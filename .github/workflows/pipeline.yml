name: Hello

on: push

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dire bonjour
        run: echo "Bonjour depuis le runner"

      - name: Lister les fichiers
        run: ls -la ./

      - name: Connexion au serveur
        env:
          APP_USER: ${{ vars.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          echo "ssh $APP_USER@srv-prod-01 (lancé par $GITHUB_ACTOR, run n°$GITHUB_RUN_NUMBER)"
          echo "Mot de passe : $PASSWORD"
          echo "Longueur du mot de passe : ${#PASSWORD} caractères"
          echo "Diagnostic : c'est le DNS."